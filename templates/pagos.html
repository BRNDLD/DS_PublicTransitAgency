{% extends "panelUsuario.html" %}

{% block content %}
    <h2>Compra de Ticket</h2>
    <p>Servicio: {{ servicio.tipo }}</p>
    <p>Placa del Vehículo: {{ servicio.placa_vehiculo }}</p>
    <p>Horario: {{ servicio.horario }}</p>
    <p>Ruta: {{ servicio.ruta }}</p>
    <p>Precio: {{ servicio.precio }}</p>

    <form action="/usuario/{{ user_name }}/pagos/{{ servicio.id }}/comprar" method="post">
        <label for="username">Nombre de usuario:</label><br>
        <input type="text" id="username" name="username"><br>
        <label for="password">Contraseña:</label><br>
        <input type="password" id="password" name="password"><br>
        <label for="tarjeta">Número de Tarjeta:</label><br>
        <input type="text" id="tarjeta" name="tarjeta"><br>
        <label for="fecha_expiracion">Fecha de Expiración:</label><br>
        <input type="text" id="fecha_expiracion" name="fecha_expiracion"><br>
        <label for="cvv">CVV:</label><br>
        <input type="text" id="cvv" name="cvv"><br>
        <input type="submit" value="Comprar">
    </form>
{% endblock %}
