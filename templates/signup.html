{% extends 'base.html' %}
{% block content %}
    <div class="content">
        <h2>Registrarse</h2>
        <form action="/signup" method="post">
            <div class="form-field">
                <input type="text" name="username" placeholder="Usuario" required>
                <img src="{{ url_for('static', path='advertencia.png') }}" alt="Advertencia" class="tooltip" data-tooltip="El nombre de usuario debe tener al menos 6 caracteres.">
            </div>
            <div class="form-field">
                <input type="password" name="password" placeholder="Contraseña" required>
                <img src="{{ url_for('static', path='advertencia.png') }}" alt="Advertencia" class="tooltip" data-tooltip="La contraseña debe tener al menos 8 caracteres y contener al menos un número.">
            </div>
            <div class="form-field">
                <input type="password" name="confirm_password" placeholder="Confirmar Contraseña" required>
            </div>
            <button type="submit">Registrarse</button>
        </form>
        {% if error %}
        <p style="color: red; text-align: center;">{{ error }}</p>
        {% endif %}
        {% if success %}
        <p style="color: green; text-align: center;">{{ success }}</p>
        <a href="{{ url_for('login') }}" class="button" style="background-color: green; color: white; display: block; text-align: center; padding: 10px 0; border-radius: 5px; margin-top: 10px; text-decoration: none;">Iniciar sesión</a>
        {% endif %}
    </div>
    <style>
        .content {
            text-align: center;
            margin-top: 100px;
            background-image: url('fondo.jpg');
            background-size: cover;
            font-family: Arial, sans-serif;
            color: #000;
        }

        h2 {
            color: #000;
        }

        form {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: rgba(255, 165, 0, 0.7);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .form-field {
            position: relative;
        }

        .tooltip {
            position: absolute;
            top: 0;
            right: 5px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
        }

        button {
            background-color: orange;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            margin-top: 20px;
        }
    </style>
    <script>
        // Agregar el comportamiento del tooltip
        const tooltips = document.querySelectorAll('.tooltip');
        tooltips.forEach((tooltip) => {
            tooltip.addEventListener('mouseover', () => {
                const message = tooltip.getAttribute('data-tooltip');
                const tooltipElement = document.createElement('div');
                tooltipElement.className = 'tooltip-message';
                tooltipElement.innerText = message;
                tooltip.parentElement.appendChild(tooltipElement);
            });

            tooltip.addEventListener('mouseout', () => {
                const tooltipElement = tooltip.parentElement.querySelector('.tooltip-message');
                if (tooltipElement) {
                    tooltipElement.remove();
                }
            });
        });
    </script>
</style>
{% endblock %}
