<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTAGENCY</title>
    <style>
        body {
            background-color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            position: relative;
        }

        .logo {
            margin: 0;
        }

        .logo img {
            width: 50px;
            height: auto;
        }

        .buttons {
            display: flex;
            align-items: center;
        }

        .button {
            padding: 10px 20px;
            background-color: orange;
            color: black;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            margin: 0 10px;
        }

        .login-button {
            background-color: black;
            color: orange;
        }

        .about-us {
            position: absolute;
            bottom: 10px; /* Distancia desde la parte inferior */
            right: 20px; /* Distancia desde la derecha */
            text-decoration: none;
            color: orangered; /* Cambia el color a tu preferencia */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">
            <a href="{{ url_for('home') }}" style="text-decoration: none;">
                <img src="{{ url_for('static', path='logotipo.png') }}" alt="PT AGENCY" title="PT AGENCY">
            </a>
        </h1>
        <div class="buttons">
            <a href="{{ url_for('login') }}" class="button login-button">Iniciar Sesión</a>
            <a href="{{ url_for('signup') }}" class="button">Registrarse</a>
        </div>
    </div>
    <div id="content" style="padding: 20px;">
        {% block content %}{% endblock %}
    </div>
    <a id="about-us" href="{{ url_for('about')}}" class="about-us">Acerca De Nosotros</a>
    <script>
        window.addEventListener('load', function () {
            const content = document.getElementById('content');
            const aboutUs = document.getElementById('about-us');

            if (content.scrollHeight > window.innerHeight) {
                aboutUs.style.position = 'fixed';
                aboutUs.style.bottom = '10px';
                aboutUs.style.right = '20px';
            }
        });
    </script>
</body>
</html>
