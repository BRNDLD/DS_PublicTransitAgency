<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Gestión de Programación de Transporte</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>

<body>
    <div class="container text-center">
        <h1>Gestión de Programación de Transporte</h1>

        <!-- Sección para agregar y borrar rutas -->
        <div>
            <label for="new-route">Nueva Ruta:</label>
            <input type="text" id="new-route" name="new-route" placeholder="Ingrese nueva ruta">
            <button id="add-route">Agregar Ruta</button>
            <button id="delete-route">Borrar Ruta</button>
        </div>

        <!-- Sección para seleccionar una ruta existente -->
        <div>
            <label for="select-route">Seleccione una ruta existente:</label>
            <select id="select-route" name="select-route">
                <option value="" disabled selected>Seleccionar una ruta</option>
                {% for route in routes %}
                <option value="{{ route }}">{{ route }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Formulario para agregar servicios -->
        <form id="service-form">
            <input type="hidden" id="tipo" name="tipo" value="">
            <label for="vehiculo">Seleccione un vehículo activo:</label>
            <select id="vehiculo" name="vehiculo" required>
                <option value="" disabled selected>Seleccionar un vehículo</option>
                {% for vehicle in active_vehicles %}
                <option value="{{ vehicle.tipo }} - {{ vehicle.placa }}">{{ vehicle.tipo }} - {{ vehicle.placa }}
                </option>
                {% endfor %}
            </select><br>

            <label for="horario">Horario:</label>
            <input type="time" id="horario" name="horario" required><br>

            <button type="submit">Agregar Horario</button>
        </form>

        <!-- Tabla para mostrar servicios -->
        <table class="table">
            <thead>
                <tr>
                    <th>Vehículo</th>
                    <th>Ruta</th>
                    <th>Horario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for service in data %}
                <tr>
                    <td>{{ service.vehiculo }}</td>
                    <td>{{ service.ruta }}</td>
                    <td>{{ service.horario }}</td>
                    <td><button class="delete-service" data-id="{{ service.id }}">Eliminar</button></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                function loadProgramacionJsonServices() {
                    fetch('/programacion-json')
                        .then(response => response.json())
                        .then(data => {
                            // Limpiar la tabla
                            clearTable();

                            // Llenar la tabla con los servicios
                            data.forEach(service => {
                                addServiceToTable(service);
                            });
                        })
                        .catch(error => {
                            console.error('Error fetching programacion.json:', error);
                        });
                }

                function clearTable() {
                    const tbody = document.querySelector('.table tbody');
                    if (tbody) {
                        tbody.innerHTML = '';
                    }
                }

                function addServiceToTable(service) {
                    const tbody = document.querySelector('.table tbody');
                    if (tbody) {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
            <td>${service.vehiculo}</td>
            <td>${service.ruta}</td>
            <td>${service.horario}</td>
            <td><button class="delete-service" data-id="${service.id}">Eliminar</button></td>
        `;
                        tbody.appendChild(tr);
                    }
                }
                // Manejar la eliminación de servicios
                document.querySelector('.table').addEventListener('click', function (e) {
                    if (e.target.classList.contains('delete-service')) {
                        const serviceId = e.target.dataset.id;
                        // Lógica para eliminar el servicio con el id `serviceId`
                        // Puedes usar fetch para enviar una solicitud DELETE al servidor
                        // y luego volver a cargar los servicios con loadProgramacionJsonServices
                        // ...
                        // Ejemplo:
                        fetch(`/services/${serviceId}/`, {
                            method: 'DELETE'
                        })
                            .then(response => response.json())
                            .then(data => {
                                // Vuelve a cargar los servicios después de la eliminación
                                loadProgramacionJsonServices();
                            })
                            .catch(error => {
                                console.error('Error deleting service:', error);
                            });
                    }
                });

                function loadRoutes() {
                    fetch('/routes')
                        .then(response => response.json())
                        .then(routes => {
                            const selectRoute = document.getElementById('select-route');
                            selectRoute.innerHTML = '<option value="" disabled selected>Seleccionar una ruta</option>';
                            routes.forEach(route => {
                                selectRoute.innerHTML += `<option value="${route}">${route}</option>`;
                            });
                        });
                }

                function addRoute() {
                    const selectRoute = document.getElementById('select-route');
                    const newRouteInput = document.getElementById('new-route');
                    const newRoute = newRouteInput.value.trim();

                    if (newRoute) {
                        selectRoute.innerHTML += `<option value="${newRoute}">${newRoute}</option>`;
                        selectRoute.value = newRoute;
                        newRouteInput.value = '';

                        // Agrega la nueva ruta al servidor
                        fetch('/routes', {
                            method: 'POST',
                            body: JSON.stringify({ route: newRoute }),
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        })
                            .then(response => response.json())
                            .then(routes => {
                                console.log(routes);
                            });
                    }
                }

                function deleteRoute() {
                    const selectRoute = document.getElementById('select-route');
                    const selectedRoute = selectRoute.value;
                    if (selectedRoute && confirm(`¿Está seguro de borrar la ruta "${selectedRoute}"?`)) {
                        selectRoute.remove(selectRoute.selectedIndex);
                        selectRoute.value = '';

                        // Elimina la ruta del servidor
                        fetch('/routes', {
                            method: 'DELETE',
                            body: JSON.stringify({ route: selectedRoute }),
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        })
                            .then(response => response.json())
                            .then(routes => {
                                console.log(routes);
                            });
                    }
                }

                const serviceForm = document.getElementById('service-form');
                serviceForm.addEventListener('submit', function (e) {
                    e.preventDefault();

                    const formData = new FormData(serviceForm);
                    formData.set('tipo', formData.get('vehiculo').split(' - ')[0]);  // Establecer el valor del campo oculto 'tipo'

                    fetch('/services', {
                        method: 'POST',
                        body: JSON.stringify({
                            tipo: formData.get('tipo'),
                            vehiculo: formData.get('vehiculo'),
                            horario: formData.get('horario'),
                            ruta: document.getElementById('select-route').value
                        }),
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    })
                        .then(response => response.json())
                        .then(data => {
                            serviceForm.reset();
                            loadProgramacionJsonServices();
                        })
                        .catch(error => {
                            console.error('Error submitting service form:', error);
                        });
                });

                document.getElementById('add-route').addEventListener('click', addRoute);
                document.getElementById('delete-route').addEventListener('click', deleteRoute);
                loadRoutes();
            });
        </script>
    </div>
</body>

</html>
