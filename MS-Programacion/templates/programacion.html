<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Gestión de Programación de Transporte</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>
    <div class="container text-center">
        <h1>Gestión de Programación de Transporte</h1>
    </div>
    <form id="service-form">
        <label for="nombre_ruta">Nombre de la Ruta:</label>
        <input type="text" id="nombre_ruta" name="nombre_ruta" required><br>

        <label for="placa_vehiculo">Placa del Vehículo:</label>
        <input type="text" id="placa_vehiculo" name="placa_vehiculo" required><br>

        <label for="tipo">Tipo de Servicio:</label>
        <select id="tipo" name="tipo">
            <option value="Autobús">Autobús</option>
            <option value="Tren">Tren</option>
            <option value="Taxis">Taxis</option>
            <option value="Adaptado">Adaptado</option>
            <option value="Privado">Privado</option>
        </select><br>

        <label for="horario">Horario:</label>
        <input type="time" id="horario" name="horario" required><br>

        <button type="submit">Agregar Ruta</button>
    </form>

    <div id="service-list-container">
        <div class="service-list">
            <h2>Servicios de Autobús</h2>
            <ul id="autobus-services">
                <!-- Contenido de la lista de autobuses -->
            </ul>
        </div>

        <div class="service-list">
            <h2>Servicios de Tren</h2>
            <ul id="tren-services">
                <!-- Contenido de la lista de trenes -->
            </ul>
        </div>

        <div class="service-list">
            <h2>Servicios de Taxis</h2>
            <ul id="taxis-services">
                <!-- Contenido de la lista de taxis -->
            </ul>
        </div>
        <div class="service-list">
            <h2>Servicios de Adaptados</h2>
            <ul id="adaptado-services">
                <!-- Contenido de la lista de adaptado -->
            </ul>
        </div>
        <div class="service-list">
            <h2>Servicios de Privados</h2>
            <ul id="privado-services">
                <!-- Contenido de la lista de privados -->
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            function loadTransportServices() {
                fetch('/services')
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('autobus-services').innerHTML = '';
                        document.getElementById('tren-services').innerHTML = '';
                        document.getElementById('taxis-services').innerHTML = '';
                        document.getElementById('adaptado-services').innerHTML = '';
                        document.getElementById('privado-services').innerHTML = '';

                        data.forEach(service => {
    const li = document.createElement('li');
    li.innerText = `Placa: ${service.placa_vehiculo}, Ruta: ${service.nombre_ruta}, Horario: ${service.horario}`;

    // Agregar botón para eliminar con atributo de datos personalizados
    const deleteButton = document.createElement('button');
    deleteButton.innerText = "Eliminar";
    deleteButton.setAttribute('data-service-id', service.id); // Establecer el atributo data-service-id

    deleteButton.addEventListener('click', function () {
        const serviceId = this.getAttribute('data-service-id'); // Obtener el ID del servicio
        fetch(`/services/${serviceId}`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            // Puedes realizar alguna acción adicional aquí después de eliminar el servicio
            // Por ejemplo, volver a cargar la lista de servicios
            loadTransportServices();
        });
    });

    li.appendChild(deleteButton);

                            // Resto del código (agregar a la lista correspondiente)
                            if (service.tipo === 'Autobús') {
                                document.getElementById('autobus-services').appendChild(li);
                            } else if (service.tipo === 'Tren') {
                                document.getElementById('tren-services').appendChild(li);
                            } else if (service.tipo === 'Taxis') {
                                document.getElementById('taxis-services').appendChild(li);
                            } else if (service.tipo === 'Adaptado') {
                                document.getElementById('adaptado-services').appendChild(li);
                            } else if (service.tipo === 'Privado') {
                                document.getElementById('privado-services').appendChild(li);
                            }
                        });
                    });
            }

            loadTransportServices();

            const serviceForm = document.getElementById('service-form');
            serviceForm.addEventListener('submit', function (e) {
                e.preventDefault();
                const formData = new FormData(serviceForm);

                fetch('/services', {
                    method: 'POST',
                    body: JSON.stringify({
                        tipo: formData.get('tipo'),
                        nombre_ruta: formData.get('nombre_ruta'),
                        placa_vehiculo: formData.get('placa_vehiculo'),
                        horario: formData.get('horario')
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                    .then(response => response.json())
                    .then(data => {
                        serviceForm.reset();
                        loadTransportServices();
                    });
            });
        });
    </script>
</body>

</html>
